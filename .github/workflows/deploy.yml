name: Deploy Cloud Run
on: { push: { branches: [main] } }
permissions: { contents: read, id-token: write }
jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.WIF_PROVIDER != '' && vars.DEPLOY_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: '${{ vars.WIF_PROVIDER }}', service_account: '${{ vars.DEPLOY_SERVICE_ACCOUNT }}' }
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud builds submit backend --tag "${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/incident-support:${{ github.sha }}"
      - uses: google-github-actions/deploy-cloudrun@v2
        with: { service: '${{ vars.CLOUD_RUN_SERVICE }}', region: '${{ vars.REGION }}', image: '${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/incident-support:${{ github.sha }}', flags: '--no-allow-unauthenticated' }
